# Nginx as the single front door. "model" is the Compose service name:
# Docker's built-in DNS resolves it on the shared network.
server {
    listen 80;

    location / {
        proxy_pass http://model:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # longer than the slowest real answer (LLM apps!)
        proxy_buffering off;       # needed if you stream tokens
    }
}
