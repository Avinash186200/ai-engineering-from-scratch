name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile $(git ls-files '*.py')
      - run: python data/make_data.py
      - run: python core/fund_model.py
      - run: python day06_evals/eval_harness.py
      - run: python day08_production/app.py --selftest
