name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile $(git ls-files '*.py')
      - run: python data/make_data.py
      - run: python core/fund_model.py
      - run: python day06_evals/eval_harness.py
      - run: python day08_production/app.py --selftest
      - run: python day12_llmops/guards.py
      - run: python day12_llmops/monitor.py --selftest
      - run: python day13_cloud/smoke_test.py --selftest
      - run: python day13_cloud/canary.py
      - run: python day14_pipelines/pipeline.py
      - run: python day14_pipelines/leakage.py
      - run: python day14_pipelines/sql_examples.py
      - run: python -m pytest day15_testing -q
      - run: python day16_security/auth.py
      - run: python day16_security/tool_policy.py
      - run: python day16_security/injection.py
      - run: python day16_security/secrets_scan.py
      - run: python day17_product/service.py
      - run: python day17_product/client.py
      - run: python day17_product/contract_check.py
